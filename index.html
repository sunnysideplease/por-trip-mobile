<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#0f1419">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>포르투갈 · 스페인 여행</title>
<style>
:root {
  --bg: #0f1419;
  --bg2: #1a222c;
  --bg3: #243040;
  --card: #1e2833;
  --border: #2a3644;
  --text: #e8eef4;
  --muted: #8b9aab;
  --accent: #5b9fd4;
  --accent2: #7eb8e0;
  --warn: #e8a54b;
  --danger: #e07a6a;
  --ok: #6bc49a;
  --gap: #c9a0dc;
  --radius: 14px;
  --tap: 48px;
  --safe-b: env(safe-area-inset-bottom, 0px);
  --nav-h: calc(64px + var(--safe-b));
  --font: -apple-system, BlinkMacSystemFont, "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  font-size: 16px;
  line-height: 1.45;
  -webkit-tap-highlight-color: transparent;
  min-height: 100%;
}
body { max-width: 430px; margin: 0 auto; min-height: 100dvh; position: relative; }
a { color: var(--accent2); text-decoration: none; }
button {
  font: inherit; color: inherit; background: none; border: none; cursor: pointer;
  min-height: var(--tap); min-width: var(--tap);
}
.app-header {
  position: sticky; top: 0; z-index: 20;
  background: rgba(15,20,25,.92); backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
  padding: 12px 16px 10px;
}
.app-header h1 { font-size: 1.05rem; font-weight: 650; letter-spacing: -0.02em; }
.app-header .sub { font-size: .78rem; color: var(--muted); margin-top: 2px; }
.main {
  padding: 12px 14px calc(var(--nav-h) + 16px);
  min-height: calc(100dvh - 70px);
}
.nav {
  position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
  width: 100%; max-width: 430px;
  display: grid; grid-template-columns: repeat(6, 1fr);
  background: rgba(26,34,44,.96); backdrop-filter: blur(14px);
  border-top: 1px solid var(--border);
  padding: 4px 2px var(--safe-b);
  z-index: 30;
}
.nav a {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 2px; min-height: 56px; color: var(--muted); font-size: .65rem; font-weight: 500;
  border-radius: 10px; padding: 4px 2px;
}
.nav a.active { color: var(--accent2); }
.nav a .ico { font-size: 1.15rem; line-height: 1; }
.card {
  background: var(--card); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 14px 14px; margin-bottom: 10px;
}
.card.tap { cursor: pointer; transition: background .15s; }
.card.tap:active { background: var(--bg3); }
.card h2, .sec-title {
  font-size: .72rem; text-transform: uppercase; letter-spacing: .06em;
  color: var(--muted); font-weight: 600; margin-bottom: 8px;
}
.card h3 { font-size: 1.05rem; font-weight: 650; margin-bottom: 4px; }
.row { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.muted { color: var(--muted); font-size: .88rem; }
.sm { font-size: .82rem; }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .02em; }
.badge {
  display: inline-block; font-size: .7rem; font-weight: 650;
  padding: 3px 8px; border-radius: 999px; vertical-align: middle;
}
.badge.ok { background: rgba(107,196,154,.18); color: var(--ok); }
.badge.warn { background: rgba(232,165,75,.18); color: var(--warn); }
.badge.danger { background: rgba(224,122,106,.2); color: var(--danger); }
.badge.gap { background: rgba(201,160,220,.18); color: var(--gap); }
.badge.plan { background: rgba(91,159,212,.15); color: var(--accent2); }
.badge.partial { background: rgba(232,165,75,.18); color: var(--warn); }
.kv { display: grid; gap: 6px; margin-top: 8px; }
.kv .item { display: flex; justify-content: space-between; gap: 12px; font-size: .9rem; }
.kv .item span:first-child { color: var(--muted); flex-shrink: 0; }
.kv .item span:last-child { text-align: right; word-break: break-word; }
.list-day {
  display: flex; align-items: center; gap: 12px; padding: 12px 4px;
  border-bottom: 1px solid var(--border); min-height: var(--tap);
}
.list-day:last-child { border-bottom: none; }
.list-day .date-col { width: 54px; flex-shrink: 0; text-align: center; }
.list-day .date-col .d { font-size: 1.15rem; font-weight: 700; }
.list-day .date-col .w { font-size: .7rem; color: var(--muted); }
.chip-row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.chip {
  font-size: .75rem; padding: 4px 10px; border-radius: 8px;
  background: var(--bg3); color: var(--text); border: 1px solid var(--border);
}
.back {
  display: inline-flex; align-items: center; gap: 4px;
  color: var(--accent2); font-size: .9rem; font-weight: 550;
  min-height: 40px; margin: -4px 0 8px -4px; padding: 4px 8px;
}
.hero-date { font-size: 1.45rem; font-weight: 700; letter-spacing: -0.03em; }
.hero-city { font-size: 1.1rem; color: var(--accent2); margin-top: 2px; }
.gap-card {
  border-left: 3px solid var(--danger);
  background: rgba(224,122,106,.08);
}
.gap-card.med { border-left-color: var(--warn); background: rgba(232,165,75,.08); }
.gap-card.low, .gap-card.info { border-left-color: var(--muted); background: var(--card); }
.amount { font-variant-numeric: tabular-nums; font-weight: 600; }
.total-bar {
  background: linear-gradient(135deg, #1e2a38, #243448);
  border: 1px solid var(--border); border-radius: var(--radius);
  padding: 16px; margin-bottom: 12px;
}
.total-bar .label { font-size: .75rem; color: var(--muted); }
.total-bar .val { font-size: 1.35rem; font-weight: 700; margin-top: 2px; }
.empty { text-align: center; color: var(--muted); padding: 32px 16px; }
.loading { text-align: center; padding: 48px 16px; color: var(--muted); }
.day-picker {
  display: flex; gap: 6px; overflow-x: auto; padding: 4px 0 10px;
  -webkit-overflow-scrolling: touch; scrollbar-width: none;
}
.day-picker::-webkit-scrollbar { display: none; }
.day-pill {
  flex-shrink: 0; padding: 8px 12px; border-radius: 12px;
  background: var(--bg2); border: 1px solid var(--border);
  font-size: .8rem; min-height: 44px; display: flex; flex-direction: column;
  align-items: center; justify-content: center; line-height: 1.2;
}
.day-pill.active { background: var(--accent); border-color: var(--accent); color: #fff; }
.day-pill .w { font-size: .65rem; opacity: .8; }
.note-box {
  margin-top: 8px; padding: 10px 12px; border-radius: 10px;
  background: var(--bg2); font-size: .85rem; color: var(--muted);
}
code.pnr {
  background: var(--bg3); padding: 2px 7px; border-radius: 6px;
  font-size: .85rem; font-weight: 650;
}
.section-gap { margin-top: 18px; }
.warn-banner {
  background: rgba(224,122,106,.12); border: 1px solid rgba(224,122,106,.35);
  border-radius: var(--radius); padding: 12px 14px; margin-bottom: 12px;
  font-size: .88rem;
}
.warn-banner strong { color: var(--danger); }

.badge.locked { background: rgba(107,196,154,.18); color: var(--ok); }
.badge.suggested { background: rgba(232,165,75,.18); color: var(--warn); }
.plan-block {
  display: grid; grid-template-columns: 52px 1fr; gap: 10px;
  padding: 10px 0; border-bottom: 1px solid var(--border);
}
.plan-block:last-child { border-bottom: none; padding-bottom: 0; }
.plan-block:first-child { padding-top: 0; }
.plan-time {
  font-size: .8rem; font-weight: 700; color: var(--accent2);
  font-variant-numeric: tabular-nums; padding-top: 2px;
}
.plan-place { font-weight: 650; font-size: .95rem; }
.plan-note { font-size: .82rem; color: var(--muted); margin-top: 2px; }
.plan-kind {
  display: inline-block; margin-top: 4px; font-size: .68rem;
  padding: 2px 7px; border-radius: 6px; background: var(--bg3); color: var(--muted);
}
.live-date-head {
  font-size: .78rem; font-weight: 650; color: var(--muted);
  margin: 14px 4px 6px; letter-spacing: .02em;
}
.live-item .amt-pending { color: var(--warn); font-weight: 650; font-size: .9rem; }
.empty-soft {
  text-align: left; color: var(--muted); padding: 14px;
  font-size: .88rem; line-height: 1.5;
}
</style>
</head>

<script>

  };

    flight: '항공', train: '열차', car: '차량',
    car_rental: '렌터카', car_rental_return: '렌터카 반납'
  };

  let BOARD = null;

  function esc(s) {
    if (s == null || s === '') return '';
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
  function fmtKRW(n) {
    if (n == null || n === '') return '—';
    return '₩' + Number(n).toLocaleString('ko-KR');
  }
  function fmtEUR(n) {
    if (n == null || n === '') return '—';
    return '€' + Number(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }
  function parseYMD(s) {
    const [y,m,d] = s.split('-').map(Number);
    return new Date(y, m - 1, d);
  }
  function ymdLocal(d) {
    const y = d.getFullYear();
    const m = String(d.getMonth()+1).padStart(2,'0');
    const day = String(d.getDate()).padStart(2,'0');
    return y + '-' + m + '-' + day;
  }
  function europeTodayYMD() {
    try {
      return new Intl.DateTimeFormat('en-CA', {
        timeZone: 'Europe/Madrid', year: 'numeric', month: '2-digit', day: '2-digit'
      }).format(new Date());
    } catch (e) {
      return ymdLocal(new Date());
    }
  }
  function fmtDayTitle(dateStr) {
    const d = parseYMD(dateStr);
    const m = d.getMonth() + 1;
    const day = d.getDate();
    const w = WEEK_KO[d.getDay()];
    return m + '/' + day + ' (' + w + ')';
  }
  function fmtDayShort(dateStr) {
    const d = parseYMD(dateStr);
    return (d.getMonth()+1) + '/' + d.getDate();
  }
  function statusBadge(st) {
    if (!st) return '';
    const map = {
      confirmed: ['확정','ok'],
      planned: ['계획','plan'],
      planned_conflicts_with_direct_train: ['계획·충돌','warn'],
      missing: ['미예약','danger'],
      partial: ['부분','partial']
    };
    const [lab, cls] = map[st] || [st, 'plan'];
    return '<span class="badge ' + cls + '">' + esc(lab) + '</span>';
  }

  function lodgingLookup(name) {
    if (!name || !BOARD) return null;
    return (BOARD.bookings || []).find(b =>
      (b.category === 'hotel' || b.category === 'airbnb') &&
      (b.name === name || (b.name && name && (b.name.includes(name.slice(0,12)) || name.includes(b.name.slice(0,12)))))
    ) || null;
  }

  function enrichLodging(day) {
    const L = day.lodging || {};
    const book = lodgingLookup(L.name);
    const conf = L.confirmation || L.itinerary || (book && book.id) || null;
    const address = L.address || null;
    const checkIn = L.check_in || L.check_in_planned || null;
    const checkOut = L.check_out || null;
    const host = L.host || null;
    let amount = null;
    if (L.amount_krw != null) amount = L.amount_krw;
    else if (L.paid_krw != null) amount = L.paid_krw;
    else if (book) amount = book.amount_krw != null ? book.amount_krw : book.paid_krw;
    const payLocal = L.pay_at_property_krw != null ? L.pay_at_property_krw
      : (book && book.pay_at_property_krw != null ? book.pay_at_property_krw : null);
    const nights = book ? book.nights : null;
    return { ...L, conf, address, checkIn, checkOut, host, amount, payLocal, nights, book };
  }

  function dayGaps(dateStr) {
    const gaps = BOARD.gaps || [];

    const out = [];

      const g = gaps.find(x => x.id === 'madrid_hotel');
      if (g) out.push(g);
    }
    if (dateStr === '2026-10-02') {
      const g = gaps.find(x => x.id === 'noh_return_flight');
      if (g) out.push(g);
    }
    if (dateStr === '2026-10-01') {
      const g = gaps.find(x => x.id === 'cordoba_vs_direct_train');
      if (g) out.push(g);
    }
    if (day && day.lodging && day.lodging.status === 'missing') {
      if (!out.some(x => x.id === 'madrid_hotel')) {
        out.push({ id: 'madrid_hotel', severity: 'high', detail: '마드리드 숙소 미예약' });
      }
    }
    const airbnbDays = ['2026-09-21','2026-09-23','2026-09-27','2026-09-28','2026-09-29'];
    if (airbnbDays.includes(dateStr)) {
      const g = gaps.find(x => x.id === 'airbnb_checkin_details');
      if (g && !out.some(x => x.id === g.id)) out.push(g);
    }
    return out;
  }

  function pickTodayDay() {
    const today = europeTodayYMD();
    const days = BOARD.days;
    const hit = days.find(d => d.date === today);
    if (hit) return hit;
    const start = days[0].date;
    const end = days[days.length - 1].date;
    if (today < start) return days[0];
    if (today > end) return days[days.length - 1];
    let best = days[0];
    let bestDiff = Infinity;
    const t = parseYMD(today).getTime();
    for (const d of days) {
      const diff = Math.abs(parseYMD(d.date).getTime() - t);
      if (diff < bestDiff) { bestDiff = diff; best = d; }
    }
    return best;
  }

  function daySpendBits(day) {
    const bits = [];
    for (const t of (day.transport || [])) {
      if (t.amount_eur != null) bits.push({ label: TYPE_KO[t.type] || t.type, val: fmtEUR(t.amount_eur) });
      if (t.amount_krw != null) bits.push({ label: TYPE_KO[t.type] || t.type, val: fmtKRW(t.amount_krw) });
      if (t.amount_krw_displayed != null) bits.push({ label: (TYPE_KO[t.type]||'') + ' (표시)', val: fmtKRW(t.amount_krw_displayed) });
    }
    const L = enrichLodging(day);
    if (L.amount != null && day.lodging && (day.lodging.amount_krw != null || day.lodging.paid_krw != null)) {
      bits.push({ label: '숙소', val: fmtKRW(L.amount) });
    }
    if (L.payLocal != null && day.lodging && day.lodging.pay_at_property_krw != null) {
      bits.push({ label: '현지세', val: fmtKRW(L.payLocal) });
    }
    return bits;
  }

    const type = TYPE_KO[t.type] || t.type;

    else if (t.type === 'car_rental') title = (t.vendor || '렌터카') + (t.vehicle ? ' · ' + t.vehicle : '');
    else if (t.type === 'car_rental_return') title = (t.vendor || 'Hertz') + ' 반납';
    else if (t.type === 'car') title = '렌터카 이용 중';

    const lines = [];
    if (t.from && t.to) lines.push(['구간', esc(t.from) + ' → ' + esc(t.to)]);
    if (t.depart || t.arrive) {
      lines.push(['시간', esc((t.depart || '?') + (t.arrive ? ' → ' + t.arrive : ''))]);
    }
    if (t.pickup) lines.push(['픽업', esc(t.pickup)]);
    if (t.dropoff) lines.push(['반납', esc(t.dropoff)]);
    if (t.location && t.time) lines.push(['반납', esc(t.location + ' ' + t.time)]);
    if (t.pnr) lines.push(['PNR', '<code class="pnr">' + esc(t.pnr) + '</code>']);
    if (t.confirmation) lines.push(['확인코드', '<code class="pnr">' + esc(t.confirmation) + '</code>']);
    if (t.ref) lines.push(['참조', '<code class="pnr">' + esc(t.ref) + '</code>']);
    if (t.booking_ref_shown) lines.push(['예약번호', '<code class="pnr">' + esc(t.booking_ref_shown) + '</code>']);
    if (t.class) lines.push(['등급', esc(t.class)]);
    if (t.seats) {
      const seats = Object.entries(t.seats).map(([k,v]) => k + ' ' + v).join(' · ');
      lines.push(['좌석', esc(seats)]);
    }
    if (t.passengers_shown) lines.push(['탑승객(표시)', esc(t.passengers_shown.join(', '))]);
    if (t.baggage) lines.push(['수하물', esc(t.baggage)]);
    if (t.amount_eur != null) lines.push(['금액', '<span class="amount">' + fmtEUR(t.amount_eur) + '</span>']);
    if (t.amount_krw != null) lines.push(['금액', '<span class="amount">' + fmtKRW(t.amount_krw) + '</span>']);
    if (t.amount_krw_displayed != null) lines.push(['표시 금액', '<span class="amount">' + fmtKRW(t.amount_krw_displayed) + '</span>']);
    if (t.notes) lines.push(['메모', esc(t.notes)]);

    return '<div class="card">' +
      '<div class="row"><h3>' + esc(title) + '</h3>' + statusBadge(t.status) + '</div>' +
      '<div class="kv">' + lines.map(([k,v]) =>

      html += '<div class="total-bar" style="background:linear-gradient(135deg,#1a2830,#1e3040)">' +
        '<div class="label">렌터카 Hertz (EUR · 마스터 미포함)</div>' +
        '<div class="val amount">' + fmtEUR(cars.prepaid) + '</div>' +
        '<div class="muted sm" style="margin-top:6px">' + esc(cars.note || '') + '</div></div>';
    }
    html += '<div class="sec-title">항목별</div>';
    for (const s of spend) {
      const title = CAT_KO[s.category] || s.category;
      const lines = [];
      if (s.prepaid != null) {
        const cur = s.currency === 'EUR' ? fmtEUR(s.prepaid) : (s.currency === 'KRW' ? fmtKRW(s.prepaid) : String(s.prepaid));
        lines.push(['선결제', '<span class="amount">' + cur + '</span>']);
      } else {
        lines.push(['선결제', '—']);
      }
      if (s.local != null) lines.push(['현지', '<span class="amount">' + fmtKRW(s.local) + '</span>']);
      if (s.krw_display_in_master != null) lines.push(['마스터 표시 ₩', '<span class="amount">' + fmtKRW(s.krw_display_in_master) + '</span>']);
      if (s.breakdown) {
        lines.push(['내역', esc(Object.entries(s.breakdown).map(([k,v]) => k + ' ' + fmtKRW(v)).join(' · '))]);
      }
      if (s.note) lines.push(['비고', esc(s.note)]);
      const isGap = s.category === 'madrid_lodging';
      html += '<div class="card' + (isGap ? ' gap-card' : '') + '"><h3 style="font-size:1rem">' + esc(title) + '</h3>' +
        '<div class="kv">' + lines.map(([k,v]) =>
          '<div class="item"><span>' + k + '</span><span>' + v + '</span></div>'
        ).join('') + '</div></div>';
    }

    html += '<div class="section-gap sec-title">현장 지출</div>';
    const live = spendLiveList().slice().sort(function (a, b) {
      const ra = a.recorded_at || '';
      const rb = b.recorded_at || '';
      if (ra !== rb) return rb.localeCompare(ra);
      const da = a.date || '';
      const db = b.date || '';
      if (da !== db) return db.localeCompare(da);
      return String(b.id || '').localeCompare(String(a.id || ''));
    });
    if (!live.length) {
      html += '<div class="card"><p class="empty-soft">비용을 Travel Desk에 말하면 여기에 쌓입니다.</p></div>';
    } else {
      let sumEur = 0, sumKrw = 0, nEur = 0, nKrw = 0;
      for (const item of live) {
        if (item.amount == null || item.amount === '') continue;
        const cur = (item.currency || '').toUpperCase();
        if (cur === 'EUR') { sumEur += Number(item.amount); nEur++; }
        else if (cur === 'KRW') { sumKrw += Number(item.amount); nKrw++; }
      }
      if (nEur || nKrw) {
        html += '<div class="total-bar" style="background:linear-gradient(135deg,#243018,#2a3820)">';
        html += '<div class="label">현장 지출 합계 (통화별 · 환산 없음)</div>';
        if (nEur) html += '<div class="val amount" style="font-size:1.15rem;margin-top:4px">' + fmtEUR(sumEur) + '</div>';
        if (nKrw) html += '<div class="val amount" style="font-size:1.15rem;margin-top:4px">' + fmtKRW(sumKrw) + '</div>';
        html += '</div>';
      }
      const byDate = {};
      const dateOrder = [];
      for (const item of live) {
        const d = item.date || '날짜 미상';
        if (!byDate[d]) { byDate[d] = []; dateOrder.push(d); }
        byDate[d].push(item);
      }
      for (const d of dateOrder) {
        const label = d === '날짜 미상' ? d : fmtDayTitle(d);
        html += '<div class="live-date-head">' + esc(label) + '</div>';
        for (const item of byDate[d]) {
          const cat = liveCategoryLabel(item.category);
          const top = (cat ? esc(cat) : '지출') +
            (item.city ? ' · ' + esc(item.city) : '');
          html += '<div class="card live-item"><div class="row">' +
            '<h3 style="font-size:.95rem">' + top + '</h3>' +
            fmtLiveAmount(item) + '</div>';
          if (item.note) html += '<p class="muted sm" style="margin-top:6px">' + esc(item.note) + '</p>';
          const meta = [];
          if (item.receipt) meta.push('영수증 ' + esc(item.receipt));
          if (item.source) meta.push(esc(Array.isArray(item.source) ? item.source.join(', ') : item.source));
          if (item.recorded_at) meta.push(esc(item.recorded_at));
          if (meta.length) html += '<p class="muted sm" style="margin-top:4px">' + meta.join(' · ') + '</p>';
          html += '</div>';
        }
      }
    }

    html += '<p class="muted sm" style="margin-top:12px;padding:0 4px">환율은 파일에 표시된 경우만 인용. 임의 환산 없음.</p>';
    return html;
  }

  function viewGaps() {
    let html = '<div class="sec-title">열린 공백</div>';
    const order = { high: 0, medium: 1, low: 2, info: 3 };
    const gaps = (BOARD.gaps || []).slice().sort((a,b) => (order[a.severity]||9) - (order[b.severity]||9));
    for (const g of gaps) {
      const cls = g.severity === 'high' ? 'gap-card' : (g.severity === 'medium' ? 'gap-card med' : 'gap-card low');
      html += '<div class="card ' + cls + '">' +
        '<div class="row"><span class="badge ' + (SEV_CLS[g.severity]||'plan') + '">' +
        esc(SEV[g.severity] || g.severity) + '</span>' +
        '<span class="muted sm mono">' + esc(g.id) + '</span></div>' +
        '<p style="margin-top:8px">' + esc(g.detail) + '</p></div>';
    }
    return html;
  }

  function parseRoute() {
    const h = (location.hash || '#/today').replace(/^#/, '') || '/today';
    const parts = h.split('/').filter(Boolean);
    const route = parts[0] || 'today';
    const arg = parts[1] || null;
    return { route, arg };
  }

  function setNav(route) {
    const map = { today: 'today', days: 'days', day: 'days', stays: 'stays', bookings: 'bookings', spend: 'spend', gaps: 'gaps' };
    const key = map[route] || 'today';
    document.querySelectorAll('#nav a').forEach(a => {
      a.classList.toggle('active', a.dataset.r === key);
    });
  }

  function render() {
    if (!BOARD) return;
    const { route, arg } = parseRoute();
    setNav(route);
    const app = document.getElementById('app');
    let html = '';
    switch (route) {
      case 'today': html = viewToday(); break;
      case 'days': html = viewDays(); break;
      case 'day': html = viewDay(arg); break;
      case 'stays': html = viewStays(); break;
      case 'bookings': html = viewBookings(); break;
      case 'spend': html = viewSpend(); break;
      case 'gaps': html = viewGaps(); break;
      default: html = viewToday();
    }
    app.innerHTML = html;
    window.scrollTo(0, 0);
  }

  async function loadBoard() {
    const embed = document.getElementById('board-embed');
    let data = null;
    try {
      const r = await fetch('trip_board.json', { cache: 'no-cache' });
      if (r.ok) data = await r.json();
    } catch (e) { /* file:// or offline */ }
    if (!data && embed && embed.textContent.trim()) {
      try { data = JSON.parse(embed.textContent); } catch (e) {}
    }
    if (!data) throw new Error('trip_board.json을 불러올 수 없습니다');
    return data;
  }

  async function init() {
    try {
      BOARD = await loadBoard();
      const m = BOARD.meta || {};
      const sub = document.getElementById('hdr-sub');
      if (sub && m.dates) {
        sub.textContent = m.dates.start.replace(/-/g,'.') + ' – ' + m.dates.end.slice(5).replace(/-/g,'.') +
          ' · 유경 · 선욱 · 오프라인';
      }
      if (!location.hash) location.hash = '#/today';
      render();
      window.addEventListener('hashchange', render);
      if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
        navigator.serviceWorker.register('sw.js').catch(function(){});
      }
    } catch (e) {
      document.getElementById('app').innerHTML =
        '<div class="empty">데이터 로드 실패<br><span class="sm">' + esc(e.message) + '</span></div>';
    }
  }
  init();
})();
</script>
</body>
</html>
